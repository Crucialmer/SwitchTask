name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # 允许手动触发（测试构建，不发布 Release）

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # 创建 Release 所需

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches CMake version (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $m = Select-String -Path CMakeLists.txt -Pattern 'SwitchTask VERSION ([0-9][0-9.]*)'
          if (-not $m) { throw "Cannot parse project VERSION from CMakeLists.txt" }
          $ver = $m.Matches[0].Groups[1].Value
          # 归一化比较：去前缀 v、按组件去尾随 .0（保留至少两位）——支持 tag v1.0 与 CMake 1.0.0 等价
          function Get-Norm([string]$s) {
            if ($s.StartsWith('v')) { $s = $s.Substring(1) } # 与运行时一致：只剥一个前导 v（TrimStart 会剥掉全部）
            while (($s.Split('.').Count -gt 2) -and $s.EndsWith('.0')) { $s = $s.Substring(0, $s.Length - 2) }
            return $s
          }
          if ((Get-Norm $tag) -ne (Get-Norm $ver)) { throw "Tag $tag does not match CMake version v$ver" }
          Write-Host "Tag matches CMake version: $tag"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt (6.8.x, MSVC 2022 x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true

      - name: Configure (CMake)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Locate exe
        id: exe
        shell: pwsh
        run: |
          # 多配置生成器（VS）产物在 build/Release/ 下
          $exe = Get-ChildItem -Path build -Recurse -Filter SwitchTask.exe | Select-Object -First 1
          if (-not $exe) { throw "SwitchTask.exe not found" }
          echo "path=$($exe.DirectoryName)" >> $env:GITHUB_OUTPUT
          echo "Exe at: $($exe.FullName)"

      - name: Deploy Qt runtime (windeployqt)
        shell: pwsh
        run: |
          $exe = "${{ steps.exe.outputs.path }}\SwitchTask.exe"
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw --compiler-runtime $exe

      - name: Package (zip)
        id: pkg
        shell: pwsh
        run: |
          $dir = "${{ steps.exe.outputs.path }}"

          # 1. 方案 1：macOS 26 悬浮胶囊卡片预览版（预置 config.ini: thumbnail/mode=popup）
          $dirPopup = "$dir-popup"
          Copy-Item -Path $dir -Destination $dirPopup -Recurse
          $cfgPopup = @"
[thumbnail]
mode = popup
"@
          $cfgPopup | Out-File -FilePath "$dirPopup\config.ini" -Encoding utf8
          $zipPopup = "SwitchTask-PopupPreview.zip"
          Compress-Archive -Path "$dirPopup\*" -DestinationPath $zipPopup
          $hashPopup = (Get-FileHash -Path $zipPopup -Algorithm SHA256).Hash.ToLower()
          "$hashPopup  $zipPopup" | Out-File -FilePath "$zipPopup.sha256" -Encoding ascii

          # 2. 方案 2：macOS 26 舞台集成面板预览版（预置 config.ini: thumbnail/mode=integrated）
          $dirIntegrated = "$dir-integrated"
          Copy-Item -Path $dir -Destination $dirIntegrated -Recurse
          $cfgIntegrated = @"
[thumbnail]
mode = integrated
"@
          $cfgIntegrated | Out-File -FilePath "$dirIntegrated\config.ini" -Encoding utf8
          $zipIntegrated = "SwitchTask-IntegratedPreview.zip"
          Compress-Archive -Path "$dirIntegrated\*" -DestinationPath $zipIntegrated
          $hashIntegrated = (Get-FileHash -Path $zipIntegrated -Algorithm SHA256).Hash.ToLower()
          "$hashIntegrated  $zipIntegrated" | Out-File -FilePath "$zipIntegrated.sha256" -Encoding ascii

          # 3. 标准全能包（SwitchTask.zip，发布标准资产名）
          $zipName = "SwitchTask.zip"
          Compress-Archive -Path "$dir\*" -DestinationPath $zipName
          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Out-File -FilePath "$zipName.sha256" -Encoding ascii

          echo "name=$zipName" >> $env:GITHUB_OUTPUT
          Write-Host "Packaged:"
          Write-Host "  - $zipPopup"
          Write-Host "  - $zipIntegrated"
          Write-Host "  - $zipName"

      - name: Upload artifact (always, incl. manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: SwitchTask-Packages
          path: |
            SwitchTask-PopupPreview.zip
            SwitchTask-PopupPreview.zip.sha256
            SwitchTask-IntegratedPreview.zip
            SwitchTask-IntegratedPreview.zip.sha256
            SwitchTask.zip
            SwitchTask.zip.sha256

      - name: Create GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SwitchTask ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            SwitchTask-PopupPreview.zip
            SwitchTask-PopupPreview.zip.sha256
            SwitchTask-IntegratedPreview.zip
            SwitchTask-IntegratedPreview.zip.sha256
            SwitchTask.zip
            SwitchTask.zip.sha256
